name: phos
description: "Camera recipes for Nikon Z cameras: import, preview and deploy looks."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  image: ^4.9.2
  path_provider: ^2.1.6
  file_picker: ^12.1.1
  url_launcher: ^6.3.2
  phos_core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true