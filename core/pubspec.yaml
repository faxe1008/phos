name: phos_core
description: >-
  Vendor-neutral camera recipe core: universal recipe model, NP3/NCP parser and
  generator, Lightroom XMP import/export, Fujifilm recipe import, and a
  fidelity-reporting conversion engine for Nikon Z bodies (Z50II reference).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  crypto: ^3.0.0
  xml: ^7.0.1

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0