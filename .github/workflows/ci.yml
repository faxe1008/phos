name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: phos_core (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          channel: stable

      - name: Pub get
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  app:
    name: app (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  apk:
    name: debug APK
    runs-on: ubuntu-latest
    needs: [core, app]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Build debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: phos-debug-arm64
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  publish:
    name: publish release
    if: github.event_name != 'pull_request'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: phos-debug-arm64
          path: out

      - name: Resolve release name and tag
        id: rel
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tagged build: the tag is the release name.
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          else
            # Branch build: one release per CI run, named after the run
            # number, so every successful build accumulates its own
            # release (Build 7, Build 8, ...). The tag must be a valid
            # git ref (no spaces), hence "build-N".
            echo "name=Build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=out/app-debug.apk
          # Check by tag (the release's unique key), not by name:
          # "gh release view" does not reliably match release names.
          if gh release view "${{ steps.rel.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.rel.outputs.tag }}" "$apk" --clobber
          else
            gh release create "${{ steps.rel.outputs.tag }}" \
              --title "${{ steps.rel.outputs.name }}" \
              --notes "phos ${{ steps.rel.outputs.name }} — built from ${{ github.ref_name }} (${{ github.sha }})" \
              ${{ steps.rel.outputs.prerelease }} \
              "$apk"
          fi